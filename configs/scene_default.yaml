# Per-scene config template.
# Copy to configs/scene_001.yaml, scene_002.yaml, etc.
# Fields here override base.yaml.

scene:
  name: "scene_001"   # must match the subdirectory name in data/raw/

  # Data paths — relative to project root
  scene_dir: "data/raw/scene_001"   # must contain train/ and test/
  # Layout expected:
  #   train/images/         ← RGB training images
  #   train/sparse/0/       ← cameras.bin, images.bin, points3D.bin
  #   test/test_poses.csv   ← target camera poses

# Model overrides for this scene (optional)
# model:
#   sh_degree: 3

# Enable scale regularisation for thin structures (antennas, cables)
loss:
  scale_reg_weight: 0.01   # set >0 if floaters appear around thin structures

# Training overrides (optional)
# optimizer:
#   iterations: 20000

# Render at full resolution (override if memory is tight)
# max_image_size: 1920
